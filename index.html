<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esencia Vital - Tienda Online</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->

    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel para compilar JSX en el navegador -->

    <style>
        /* Estilos adicionales de utilidad */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .animate-in {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="antialiased">
    <!-- Contenedor principal de React -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONOS SVG REUTILIZABLES ---
        // Se definen de forma local para no depender de librerías de terceros en el HTML
        const IconWrapper = ({ size = 24, className = "", children }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}

        );

        const ShoppingCart = (p) => <IconWrapper {...p}><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></IconWrapper>;
        const Menu = (p) => <IconWrapper {...p}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></IconWrapper>;
        const X = (p) => <IconWrapper {...p}><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></IconWrapper>;
        const Search = (p) => <IconWrapper {...p}><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></IconWrapper>;
        const ChevronRight = (p) => <IconWrapper {...p}><polyline points="9 18 15 12 9 6"/></IconWrapper>;
        const CheckCircle2 = (p) => <IconWrapper {...p}><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></IconWrapper>;
        const Minus = (p) => <IconWrapper {...p}><line x1="5" x2="19" y1="12" y2="12"/></IconWrapper>;
        const Plus = (p) => <IconWrapper {...p}><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></IconWrapper>;
        const Trash2 = (p) => <IconWrapper {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></IconWrapper>;
        const Heart = (p) => <IconWrapper {...p}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></IconWrapper>;

        const Info = (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></IconWrapper>;

        // --- BASE DE DATOS DE PRODUCTOS ---
        const PRODUCTS = [

                instructions: "Añadir 3-5 gotas en un difusor, o diluir con un aceite portador para masajes.",
                warnings: "No ingerir. Evitar contacto directo con los ojos. Mantener fuera del alcance de los niños."
            },
            {

                price: 24500,

                image: "https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&q=80&w=800",
                description: "Potente antioxidante que ayuda a iluminar el rostro, unificar el tono y reducir la apariencia de líneas finas de expresión.",
                features: ["30ml", "Vitamina C al 15%", "Con Ácido Hialurónico", "Cruelty Free"],
                instructions: "Aplicar 2-3 gotas sobre el rostro limpio por la mañana antes de la crema hidratante.",
                warnings: "Uso externo. Usar protector solar durante el día."
            },
            {
                id: 3,
                name: "Infusión Herbal Detox y Bienestar",
                price: 9990,
                category: "Infusiones",
                image: "https://images.unsplash.com/photo-1576092762791-dd9e2220bac1?auto=format&fit=crop&q=80&w=800",
                description: "Mezcla de hierbas seleccionadas (té verde, diente de león, menta y jengibre) diseñada para apoyar el bienestar digestivo natural.",
                features: ["100g", "Ingredientes orgánicos", "Rinde 50 tazas", "Sin cafeína añadida"],
                instructions: "Infusionar 1 cucharadita en agua caliente (90°C) durante 3-5 minutos.",
                warnings: "Consultar con un especialista en caso de embarazo."
            },
            {

                price: 18900,
                category: "Cuidado Corporal",
                image: "https://images.unsplash.com/photo-1601049541289-9b1b7bf22d3b?auto=format&fit=crop&q=80&w=800",
                description: "Crema ultra hidratante de rápida absorción. Enriquecida con aceite de almendras y manteca de karité para una piel suave y nutrida.",
                features: ["250ml", "Apto para pieles sensibles", "Libre de parabenos", "Aroma suave"],
                instructions: "Aplicar generosamente sobre la piel limpia y seca mediante masajes circulares.",
                warnings: "Suspender su uso en caso de irritación."
            },
            {
                id: 5,
                name: "Rodillo de Jade Natural Auténtico",
                price: 14500,
                category: "Accesorios",
                image: "https://images.unsplash.com/photo-1598440947619-2c35fc9aa908?auto=format&fit=crop&q=80&w=800",
                description: "Herramienta de masaje facial tradicional. Ayuda a mejorar la circulación, reducir la inflamación y promover el drenaje linfático.",
                features: ["Piedra de Jade 100% Natural", "Doble cabezal", "Incluye bolsa de lino"],
                instructions: "Deslizar suavemente sobre el rostro limpio en movimientos ascendentes. Conservar en el refrigerador para mayor efecto descongestionante.",
                warnings: "Manejar con cuidado, piedra frágil a las caídas."
            },
            {
                id: 6,
                name: "Set Velas Aromáticas Armonía",
                price: 22000,
                category: "Hogar",
                image: "https://images.unsplash.com/photo-1602874801007-bd458cb6c975?auto=format&fit=crop&q=80&w=800",
                description: "Set de 3 velas de cera de soja ecológica. Aromas: Vainilla Calmante, Bosque de Eucalipto y Cítricos Energizantes.",
                features: ["Cera de soja natural", "Mecha de algodón sin plomo", "Duración: 20 horas c/u"],
                instructions: "Mantener encendida un máximo de 3 horas seguidas. Recortar la mecha antes de cada uso.",
                warnings: "Nunca dejar una vela desatendida. Mantener alejado de corrientes de aire."
            }
        ];

        const CATEGORIES = ["Todos", "Aromaterapia", "Cuidado Facial", "Cuidado Corporal", "Infusiones", "Accesorios", "Hogar"];

        // --- UTILIDADES ---
        const formatPrice = (price) => {
            return new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP' }).format(price);
        };

        function App() {
            // --- ESTADOS ---
            const [currentView, setCurrentView] = useState('home');
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [cart, setCart] = useState([]);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            const [toast, setToast] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('Todos');

            const [checkoutForm, setCheckoutForm] = useState({
                name: '',
                city: '',
                delivery: 'Envío a domicilio',
                comments: ''
            });

            // --- EFECTOS ---
            useEffect(() => {
                const savedCart = localStorage.getItem('esenciaVitalCart');
                if (savedCart) setCart(JSON.parse(savedCart));
            }, []);

            useEffect(() => {
                localStorage.setItem('esenciaVitalCart', JSON.stringify(cart));
            }, [cart]);

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3000);
            };

            // --- NAVEGACIÓN ---
            const navigateTo = (view, product = null) => {
                setCurrentView(view);
                setSelectedProduct(product);
                setIsMobileMenuOpen(false);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            // --- CARRITO ---
            const addToCart = (product, quantity = 1) => {
                setCart(prev => {
                    const existing = prev.find(item => item.product.id === product.id);
                    if (existing) {
                        return prev.map(item => 
                            item.product.id === product.id 
                                ? { ...item, quantity: item.quantity + quantity }
                                : item
                        );
                    }
                    return [...prev, { product, quantity }];
                });
                showToast("Producto agregado al carrito");
            };

            const updateCartQty = (productId, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.product.id === productId) {
                        const newQty = item.quantity + delta;
                        return newQty > 0 ? { ...item, quantity: newQty } : item;
                    }
                    return item;
                }));
            };

            const removeFromCart = (productId) => {
                setCart(prev => prev.filter(item => item.product.id !== productId));
            };

            const getCartTotal = () => {
                return cart.reduce((total, item) => total + (item.product.price * item.quantity), 0);
            };

            const getCartCount = () => {
                return cart.reduce((count, item) => count + item.quantity, 0);
            };

            // --- WHATSAPP ---
            const openWhatsApp = (message) => {
                const encodedMessage = encodeURIComponent(message);
                window.open(`https://wa.me/${STORE_CONFIG.phone}?text=${encodedMessage}`, '_blank');
            };

            const handleDirectBuy = (product) => {
                const msg = `¡Hola! Me interesa comprar directamente el producto:\n\n*${product.name}*\nPrecio: ${formatPrice(product.price)}\n\n¿Podrían confirmarme disponibilidad?`;
                openWhatsApp(msg);
            };

            const handleCheckout = (e) => {
                e.preventDefault();
                if (!checkoutForm.name.trim()) {
                    showToast("Por favor ingresa tu nombre");
                    return;
                }

                let msg = `¡Hola! Quiero realizar un pedido en *${STORE_CONFIG.name}*.\n\n*Mis productos:*\n`;
                
                cart.forEach((item, index) => {
                    msg += `${index + 1}. ${item.product.name} — ${item.quantity} ${item.quantity > 1 ? 'unids.' : 'unid.'} — ${formatPrice(item.product.price * item.quantity)}\n`;
                });
                
                msg += `\n*Subtotal de productos:* ${formatPrice(getCartTotal())}\n\n`;
                
                msg += `*Datos del cliente:*\n`;
                msg += `Nombre: ${checkoutForm.name}\n`;
                if (checkoutForm.city) msg += `Ciudad/Comuna: ${checkoutForm.city}\n`;
                msg += `Entrega: ${checkoutForm.delivery}\n`;
                if (checkoutForm.comments) msg += `Comentarios: ${checkoutForm.comments}\n\n`;
                
                msg += `¿Podrían confirmarme la disponibilidad, el costo de envío, los medios de pago y el total final? ¡Gracias!`;

                openWhatsApp(msg);
            };

            // --- COMPONENTES UI ---
            const Button = ({ children, onClick, className = "", variant = "primary", icon: IconComponent, type = "button" }) => {
                const baseStyle = "flex items-center justify-center gap-2 px-6 py-3 rounded-full font-medium transition-all duration-300 w-full md:w-auto";
                const variants = {
                    primary: `bg-[${STORE_CONFIG.colors.primary}] hover:bg-[${STORE_CONFIG.colors.primaryHover}] text-white shadow-md hover:shadow-lg`,
                    secondary: "bg-white text-[#2C3E35] border-2 border-[#2C3E35] hover:bg-[#2C3E35] hover:text-white",
                    whatsapp: "bg-[#25D366] hover:bg-[#1DA851] text-white shadow-md hover:shadow-lg",
                    ghost: "text-[#2C3E35] hover:bg-stone-200"
                };

                return (
                    <button type={type} onClick={onClick} className={`${baseStyle} ${variants[variant]} ${className}`}>
                        {IconComponent && <IconComponent size={20} className={variant === 'whatsapp' ? "w-5 h-5" : ""} />}
                        {children}
                    </button>
                );
            };

            const ProductCard = ({ product }) => (
                <div className="bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-shadow duration-300 flex flex-col group border border-stone-100">
                    <div className="relative overflow-hidden cursor-pointer h-64" onClick={() => navigateTo('product', product)}>
                        <img 
                            src={product.image} 
                            alt={product.name} 
                            className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                        />
                        <div className="absolute top-3 right-3 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-xs font-semibold text-[#6B8E7B]">
                            {product.category}
                        </div>
                    </div>
                    <div className="p-5 flex flex-col flex-grow">
                        <h3 className="font-semibold text-lg text-[#2C3E35] mb-2 leading-tight flex-grow cursor-pointer hover:text-[#6B8E7B]" onClick={() => navigateTo('product', product)}>
                            {product.name}
                        </h3>
                        <p className="text-xl font-bold text-[#2C3E35] mb-4">{formatPrice(product.price)}</p>
                        <div className="flex gap-2 mt-auto">
                            <Button variant="secondary" className="flex-1 text-sm py-2 px-0" onClick={() => navigateTo('product', product)}>
                                Ver detalles
                            </Button>
                            <button 
                                onClick={() => addToCart(product)}
                                className="bg-[#6B8E7B] hover:bg-[#5A7A68] text-white p-2 rounded-full transition-colors flex items-center justify-center min-w-[48px]"
                                title="Agregar al carrito"
                            >
                                <ShoppingCart size={20} />
                            </button>
                        </div>
                    </div>
                </div>
            );

            // --- VISTAS ---
            const renderHome = () => (
                <div className="animate-in">
                    {/* Hero Section */}
                    <section className="relative h-[80vh] md:h-[60vh] bg-stone-200 overflow-hidden flex items-center">
                        <img 
                            src="https://images.unsplash.com/photo-1540555700478-4be289fbecef?auto=format&fit=crop&q=80&w=1600" 
                            alt="Spa Natural" 
                            className="absolute inset-0 w-full h-full object-cover opacity-60 mix-blend-multiply"
                        />
                        <div className="absolute inset-0 bg-gradient-to-r from-stone-900/60 to-transparent"></div>
                        <div className="container mx-auto px-6 relative z-10">
                            <div className="max-w-xl text-white">
                                <h1 className="text-4xl md:text-6xl font-serif mb-4 leading-tight">Bienestar natural para tu cuerpo y mente</h1>
                                <p className="text-lg md:text-xl mb-8 text-stone-200">Descubre nuestra cuidada selección de productos formulados para nutrir, relajar y revitalizar tu esencia.</p>
                                <Button onClick={() => navigateTo('store')} icon={ShoppingCart} className="w-full md:w-auto text-lg">
                                    Explorar Tienda
                                </Button>
                            </div>
                        </div>
                    </section>

                    {/* Beneficios */}
                    <section className="py-12 bg-white">
                        <div className="container mx-auto px-6">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                <div className="flex flex-col items-center text-center p-6">
                                    <div className="bg-[#E8F0E9] p-4 rounded-full text-[#6B8E7B] mb-4"><Leaf size={32} /></div>
                                    <h3 className="font-semibold text-lg mb-2">Ingredientes Naturales</h3>
                                    <p className="text-stone-500">Seleccionamos lo mejor de la naturaleza para tu cuidado.</p>
                                </div>
                                <div className="flex flex-col items-center text-center p-6">
                                    <div className="bg-[#E8F0E9] p-4 rounded-full text-[#6B8E7B] mb-4"><ShieldCheck size={32} /></div>
                                    <h3 className="font-semibold text-lg mb-2">Compra Segura</h3>
                                    <p className="text-stone-500">Atención personalizada y coordinación directa por WhatsApp.</p>
                                </div>
                                <div className="flex flex-col items-center text-center p-6">
                                    <div className="bg-[#E8F0E9] p-4 rounded-full text-[#6B8E7B] mb-4"><Truck size={32} /></div>
                                    <h3 className="font-semibold text-lg mb-2">Envíos a todo Chile</h3>
                                    <p className="text-stone-500">Recibe tus productos en la comodidad de tu hogar.</p>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Productos Destacados */}
                    <section className="py-16 bg-[#F9F8F6]">
                        <div className="container mx-auto px-6">
                            <div className="flex justify-between items-end mb-10">
                                <div>
                                    <h2 className="text-3xl font-serif text-[#2C3E35] mb-2">Nuestros Favoritos</h2>
                                    <p className="text-stone-500">Los productos más elegidos por nuestros clientes.</p>
                                </div>
                                <button onClick={() => navigateTo('store')} className="hidden md:flex items-center text-[#6B8E7B] hover:text-[#5A7A68] font-medium">
                                    Ver todos <ChevronRight size={20} />
                                </button>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                {PRODUCTS.slice(0, 3).map(product => (
                                    <ProductCard key={product.id} product={product} />
                                ))}
                            </div>
                            <button onClick={() => navigateTo('store')} className="mt-8 w-full md:hidden flex items-center justify-center gap-2 text-[#6B8E7B] font-medium p-4 border border-[#6B8E7B] rounded-full">
                                Ver catálogo completo <ChevronRight size={20} />
                            </button>
                        </div>
                    </section>
                </div>
            );

            const renderStore = () => {
                const filteredProducts = PRODUCTS.filter(p => {
                    const matchCategory = selectedCategory === 'Todos' || p.category === selectedCategory;
                    const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                        p.description.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchCategory && matchSearch;
                });
